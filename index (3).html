<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>资源分享</title>
<style>
  :root {
    --ink: #111;
    --muted: #8a8a8a;
    --line: #ececec;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: #fff; }

  body {
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Microsoft YaHei", "Segoe UI", sans-serif;
    padding: 56px 20px 96px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 820px; margin: 0 auto; }

  /* ---------- 顶部标题 ---------- */
  .head { margin-bottom: 56px; }
  .head h1 { font-size: 22px; font-weight: 600; letter-spacing: .5px; }
  .head p { margin-top: 8px; font-size: 13px; color: var(--muted); }

  /* ---------- 资源列表 ---------- */
  .list { display: flex; flex-direction: column; gap: 44px; }

  /* 每个资源块：整体靠右 */
  .item {
    text-align: right;
    padding-bottom: 40px;
    border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: none; padding-bottom: 0; }

  /* 图片：放在最右边 */
  .thumb {
    display: block;
    margin-left: auto;            /* 确保图片贴右 */
    width: 320px;
    max-width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 10px;
    background: #f6f6f6;
    border: 1px solid var(--line);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .thumb:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
  }

  /* 名字：图片下方 */
  .name {
    margin-top: 18px;
    font-size: 17px;
    font-weight: 600;
    line-height: 1.4;
  }

  .desc {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  /* 下载链接：名字下方 */
  .download {
    display: inline-block;
    margin-top: 14px;
    font-size: 14px;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 2px;
    transition: opacity .2s;
  }
  .download:hover { opacity: .55; }
  .download::after { content: " ↓"; }

  /* ---------- 空状态 ---------- */
  .empty {
    text-align: right;
    font-size: 14px;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    body { padding: 36px 16px 64px; }
    .head { margin-bottom: 36px; }
    .thumb { width: 100%; }
    .list { gap: 36px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="head">
    <h1>资源分享</h1>
    <p>整理的一些素材与工具，点名称下方的链接即可下载。</p>
  </header>

  <main class="list" id="list"></main>
</div>

<script>
  /* ============================================
     在这里添加 / 修改你的资源
     name  —— 资源名字
     desc  —— 一句描述（可删）
     image —— 图片地址（本地或网络都行）
     link  —— 下载链接
     ============================================ */
  const resources = [
    {
      name: "Nurtale Nesche.1.0.6",
      desc: "提取码aA3i志愿者提供",
      image: "https://galgame.dev/assets/uploads/files/1790932401973-photo_2026-09-10_19-27-39_upscayl_2x_ultramix_balanced.jpg",
      link: "https://pan.quark.cn/s/1abdcfaf051e"
    },
    {
      name: "flowerfairy",
      desc: "提取码7Z2r自购",
      image: "https://cdn.mobygames.com/covers/17191303-flower-fairy-windows-front-cover.png",
      link: "https://pan.quark.cn/s/ef7d85b4f658"
    },
    {
      name: "滚木",
      desc: "",
      image: "",
      link: ""
    }
  ];

  // 图片加载失败时的占位图
  const PLACEHOLDER =
    "data:image/svg+xml;charset=utf-8," +
    encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480">' +
        '<rect width="100%" height="100%" fill="#f4f4f4"/>' +
        '<text x="50%" y="50%" fill="#c9c9c9" font-family="sans-serif" ' +
        'font-size="20" text-anchor="middle" dominant-baseline="middle">暂无图片</text>' +
      '</svg>'
    );

  const list = document.getElementById("list");

  if (!resources.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "还没有资源，去代码里添加吧。";
    list.appendChild(p);
  }

  resources.forEach(function (r) {
    const item = document.createElement("article");
    item.className = "item";

    // 1. 图片（最右边）
    const img = document.createElement("img");
    img.className = "thumb";
    img.src = r.image;
    img.alt = r.name;
    img.loading = "lazy";
    img.addEventListener("error", function () {
      if (img.src !== PLACEHOLDER) img.src = PLACEHOLDER;
    });

    // 2. 名字
    const name = document.createElement("h2");
    name.className = "name";
    name.textContent = r.name;

    item.appendChild(img);
    item.appendChild(name);

    // 3. 描述（可选）
    if (r.desc) {
      const desc = document.createElement("p");
      desc.className = "desc";
      desc.textContent = r.desc;
      item.appendChild(desc);
    }

    // 4. 下载链接
    if (r.link) {
      const a = document.createElement("a");
      a.className = "download";
      a.href = r.link;
      a.textContent = "下载";
      a.target = "_blank";
      a.rel = "noopener";
      item.appendChild(a);
    }

    list.appendChild(item);
  });
</script>

</body>
</html>

  @media (max-width: 560px) {
    body { padding: 36px 16px 64px; }
    .head { margin-bottom: 36px; }
    .thumb { width: 100%; }

  }
</style>
</head>
<body>

<div class="wrap">

  <!-- ==================================================
       ▼▼▼ 额外打赏按钮：只有图标，点击跳转新页面 ▼▼▼
